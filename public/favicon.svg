<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Волшебники Пхукета">
  <defs>
    <radialGradient id="night" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1B2C5E"/>
      <stop offset="0.6" stop-color="#0D1530"/>
      <stop offset="1" stop-color="#070B19"/>
    </radialGradient>
    <radialGradient id="ruby" cx="36%" cy="32%" r="72%">
      <stop offset="0" stop-color="#FF7A84"/>
      <stop offset="0.45" stop-color="#E23A4C"/>
      <stop offset="1" stop-color="#7A1020"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE3A6"/>
      <stop offset="0.5" stop-color="#F5C76A"/>
      <stop offset="1" stop-color="#D99A32"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#night)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#F5C76A" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Palm fronds instead of the ornament's hanging loop, with a New Year star above -->
  <g fill="url(#gold)">
    <path d="M32 21 C27 11 17 8.5 9.5 14.5 C17 12.5 25 14.5 32 21 Z"/>
    <path d="M32 21 C37 11 47 8.5 54.5 14.5 C47 12.5 39 14.5 32 21 Z"/>
    <path d="M32 21 C25 15.5 16 16.5 11 24.5 C17 19.5 25 19 32 21 Z"/>
    <path d="M32 21 C39 15.5 48 16.5 53 24.5 C47 19.5 39 19 32 21 Z"/>
    <path d="M32 3 L33.7 7.3 L38 9 L33.7 10.7 L32 15 L30.3 10.7 L26 9 L30.3 7.3 Z"/>
  </g>

  <!-- Ornament cap -->
  <rect x="27.5" y="20.5" width="9" height="5" rx="1.5" fill="url(#gold)"/>

  <!-- Ruby ornament ball -->
  <circle cx="32" cy="40.5" r="16" fill="url(#ruby)"/>
  <path d="M17.2 37.5 C22 41.5 28 42.5 32 40.5 C36 38.5 42 39.5 46.8 43.5" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <ellipse cx="25.5" cy="33" rx="4.2" ry="2.6" transform="rotate(-35 25.5 33)" fill="#FFFFFF" opacity="0.45"/>
</svg>
